name: Saudi News Watch

on:
  schedule:
    - cron: "5 * * * *"
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجربة بدون إرسال لتلقرام"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "5 * * * *" ]; then ARGS="$ARGS --fast"; fi
          python news_bot.py $ARGS

      - name: Save state
        # لا حفظ في التشغيل التجريبي، ولا من أي فرع غير main
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          mkdir -p data/archive
          git add data/state.json data/archive
          if git diff --cached --quiet; then
            exit 0
          fi

          for attempt in 1 2 3; do
            git commit -m "chore: update sent news"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to push state after $attempt attempts" >&2
              exit 1
            fi

            git fetch origin main
            python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("data/state.json")
          local = json.loads(path.read_text(encoding="utf-8"))
          remote = json.loads(subprocess.check_output(
              ["git", "show", "origin/main:data/state.json"], text=True
          ))
          for key in ("sent", "warned"):
              merged = dict(remote.get(key, {}))
              for entry, value in local.get(key, {}).items():
                  if entry in merged:
                      value = max(value, merged[entry])
                  merged[entry] = value
              local[key] = merged
          path.write_text(json.dumps(local, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
            git reset --mixed origin/main
            git add data/state.json data/archive
            if git diff --cached --quiet; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
