name: Saudi News Watch

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجربة بدون إرسال لتلقرام"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_bot.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save state
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update sent news"
            git pull --rebase --autostash origin main || git rebase --abort
            git push || (sleep 5 && git pull --rebase origin main && git push)
          fi
