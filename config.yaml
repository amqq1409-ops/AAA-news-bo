  max_age_hours: 2          # في المسار الفوري لا يُرسل إلا ما نُشر خلال آخر ساعتين
  max_messages: 8
  gulf_max_messages: 5
  wide_every_min: 5         # الفحص الواسع (أخبار Google بكل اللغات)
  full_every_min: 60        # الفحص الكامل (مع GDELT)
