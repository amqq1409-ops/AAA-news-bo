max_messages_per_run: 20
max_per_language: 2
include_other_tier: true
strict_title_filter: true
total_time_budget_sec: 1000
translate_titles: true

gdelt:
  enabled: true
  timespan: "3h"
  maxrecords: 60
  query_terms: '("Saudi Arabia" OR Riyadh OR Aramco OR NEOM OR "bin Salman")'
  languages: [english, arabic, french, german, spanish, russian, chinese, japanese, korean, turkish, persian, urdu, hindi, indonesian, portuguese, italian, hebrew, thai, vietnamese, malay, bengali, tamil, polish, dutch, ukrainian, greek, swedish, czech, romanian, hungarian, bulgarian, serbian, kazakh, uzbek, swahili, amharic, somali, hausa, nepali, norwegian, danish, finnish]

newsapi:
  enabled: true
  api_key_env: NEWSAPI_API_KEY
  endpoint: "https://newsapi.org/v2/everything"
  query: '"Saudi Arabia" OR Riyadh OR Aramco OR NEOM OR "bin Salman"'
  language: all
  page_size: 100
  sort_by: publishedAt
  lang: und

bing_news:
  enabled: true
  api_key_env: BING_NEWS_API_KEY
  endpoint: "https://api.bing.microsoft.com/v7.0/news/search"
  query: '"Saudi Arabia" OR Riyadh OR Aramco OR NEOM OR "bin Salman"'
  market: all
  count: 100
  sort_by: Date
  safe_search: Off
  lang: und

source_workers: 12

rss:
  enabled: true
  feeds:
    - {name: "وكالة الأنباء السعودية", url: "https://www.spa.gov.sa/rss.xml", lang: ar, country_ar: "السعودية"}
