max_messages_per_run: 20
# حد الأخبار لكل لغة في الفحص الواحد، مع استثناء للغات الأكثر أخبارًا
max_per_language: 2
max_per_language_overrides:
  ar: 6
  en: 6
include_other_tier: true
strict_title_filter: true
total_time_budget_sec: 420
translate_titles: true
# فلتر الحداثة: لا يُنشر إلا ما نُشر خلال آخر كذا ساعة (الأخبار الأقدم تُهمل)
max_age_hours: 6
# الأحدث أولًا: الخبر المنشور للتو يتقدم في الترتيب، ويزول هذا التقديم بعد كذا ساعة
fresh_hours: 3
# الثواني بين رسالة وأخرى في القناة
send_pause_sec: 1
# عدد العناوين التي تُترجم في طلب واحد
translate_batch: 12
# أقصى عدد من الأخبار الجديدة يُترجم ويُفحص في الفحص الواحد
max_candidates: 60

# كشف الخبر المكرر: نسبة تشابه العنوانين (0.6 = 60% من الكلمات مشتركة)
dedupe:
  similarity: 0.6
  memory_hours: 48

# توازن المناطق: خبر واحد على الأقل لكل منطقة فيها جديد، بما لا يتجاوز نصف الرسائل
regions:
  min_per_run: 1
  quota_share: 0.5
  priority: [east_asia, southeast_asia, south_asia, central_asia, africa, latin_america, oceania, mideast, europe, north_america, arab]

# أخبار الخليج (الإمارات، قطر، الكويت، البحرين، عُمان): دفعة مستقلة بعد أخبار السعودية في القناة نفسها
gulf:
  enabled: true
  max_messages_per_run: 10    # في الفحص الكامل كل ساعة
  fast_max_messages: 6        # في الفحص السريع
  max_per_country: 3          # حتى لا تطغى دولة واحدة على الدفعة
  gdelt: true
  header: false               # رسالة فاصلة "أخبار الخليج" قبل الدفعة (متوقفة: كل خبر خليجي يحمل علم دولته)

# الموجز اليومي والأسبوعي (بتوقيت الرياض). weekly_day: الاثنين=0 ... الجمعة=4 ... الأحد=6
# متوقف: كل الأخبار تُرسل فورية بلا موجزات جامعة. لإعادته اجعل enabled: true
digest:
  enabled: false
  hour: 21
  top_n: 10
  weekly_day: 4

# تنبيه في القناة إذا تعطل مصدر هذا العدد من الساعات المتواصلة
health:
  alert_after_hours: 3

# الملخص العربي وتصنيف النبرة: يعمل فقط بعد إضافة GEMINI_API_KEY أو ANTHROPIC_API_KEY في أسرار المستودع
ai:
  enabled: true
  provider: auto            # auto | gemini | anthropic
  gemini_model: auto        # auto يختار أحدث نموذج Flash متاح
  anthropic_model: claude-haiku-5-5
  max_calls_per_day: 300    # سقف يومي يحمي من أي تكلفة غير متوقعة
  fetch_article_text: true

# GDELT يعمل في الفحص الكامل كل ساعة فقط، وبحصة زمنية حتى لا يؤخر الإرسال
gdelt:
  enabled: true
  time_budget_sec: 90
  timespan: "2h"
  maxrecords: 60
  query_terms: '("Saudi Arabia" OR Riyadh OR Aramco OR NEOM OR "bin Salman")'
  languages: [english, arabic, french, german, spanish, russian, chinese, japanese, korean, turkish, persian, urdu, hindi, indonesian, portuguese, italian, hebrew, thai, vietnamese, malay, bengali, tamil, polish, dutch, ukrainian, greek, swedish, czech, romanian, hungarian, bulgarian, serbian, kazakh, uzbek, swahili, amharic, somali, hausa, nepali, norwegian, danish, finnish]

x:
  enabled: true
  lookback_minutes: 180
  max_results: 100
  max_per_run: 5            # أقصى عدد منشورات X في الفحص الواحد (لا تُحسب من حد اللغة)
